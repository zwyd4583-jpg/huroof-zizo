<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#D8EDF6">
<title>حروف زيزو</title>
<style>
@font-face{font-family:"Baloo Bhaijaan 2"; src:url("fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight:400 800; font-display:swap}
@font-face{font-family:"Noto Naskh Arabic"; src:url("fonts/NotoNaskhArabic.ttf") format("truetype"); font-weight:400 700; font-display:block}
/* Layout: one-column playroom app — Zizo greets from the top, the active section in the middle, a chunky tab bar at the bottom. Single bright "sky playroom" theme by choice. */
:root{
  --sky:#D8EDF6; --sky-dark:#B2D5E5; --paper:#FFFFFF; --note:#FFF3CF;
  --ink:#22304D; --ink-soft:#56637F; --white:#FFFFFF;
  --zizo:#B7BFCA; --zizo-dark:#949FAE; --blush:#F2A7B8;
  --orange:#E8761A; --orange-dark:#B85A0E;
  --green:#2FA65C; --green-dark:#21803F;
  --pink:#E04A80; --pink-dark:#AF305F;
  --blue:#3A8BD8; --blue-dark:#2869A8;
  --purple:#8B5BD5; --purple-dark:#6A40AE;
  --teal:#159C97; --teal-dark:#0E7773;
  --sun:#F7C531; --sun-dark:#CD9C10;
  --guide:#FCE6EE; --guide-line:#E9A3BE;
  --scrim:rgba(34,48,77,.5);
  --red:#E0413A; --red-dark:#B02E28;
  --brown:#9A6235; --brown-dark:#764A26;
  --rose:#F590C0; --rose-dark:#D4689C;
  --shade:rgba(0,0,0,.13); --shine:rgba(255,255,255,.3);
  --r1:#D3EECB; --r2:#C9E6F8; --r3:#F7E3B8; --r4:#DCD3F3;
  --lock:#C3CCD8; --lock-dark:#9FAABA;
  --f-ui:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-letter:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-ui); font-size:14px;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; touch-action:manipulation; overscroll-behavior:none;
  background:
    radial-gradient(70px 28px at 12% 9%, rgba(255,255,255,.75) 60%, transparent 63%),
    radial-gradient(90px 32px at 86% 22%, rgba(255,255,255,.65) 60%, transparent 63%),
    radial-gradient(60px 22px at 70% 58%, rgba(255,255,255,.5) 60%, transparent 63%),
    var(--sky);
  background-attachment:fixed;
}
button{font-family:inherit; cursor:pointer; -webkit-user-select:none; user-select:none}
button:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
.app{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:calc(12px + env(safe-area-inset-top,0px)) 128px}

/* header */
.brand{display:flex; align-items:center; justify-content:space-between; gap:12px}
h1{margin:0; font-size:1.6rem; font-weight:800; line-height:1.2}
h1 span{color:var(--orange)}
.stars{display:inline-flex; align-items:center; gap:6px; border:0; font-family:inherit; background:var(--sun); color:var(--ink); font-weight:800; font-size:1.15rem; border-radius:999px; padding:4px 12px; box-shadow:0 3px 0 var(--sun-dark); font-variant-numeric:tabular-nums}
.stars:active{transform:translateY(2px); box-shadow:0 1px 0 var(--sun-dark)}
.stars svg{width:22px; height:22px; color:var(--white)}
.stars svg.gift{width:20px; height:20px; color:var(--ink)}
.stars.pop{animation:pop .45s ease}
.host{display:flex; align-items:center; gap:12px; margin-top:8px}
.zizo{width:84px; height:84px; flex:none; overflow:visible; transform-origin:50% 90%; animation:bob 3s ease-in-out infinite}
.zizo.happy{animation:hop .65s ease}
.zizo.sad{animation:tilt .6s ease}
.zizo .ear{transform-box:fill-box; transform-origin:center; animation:flap 4.5s ease-in-out infinite}
.bubble{position:relative; flex:1; min-width:0; margin:0; background:var(--paper); border-radius:20px; padding:10px 16px; font-weight:700; font-size:1.08rem; line-height:1.55; box-shadow:0 3px 0 var(--sky-dark)}
.bubble::before{content:""; position:absolute; inset-inline-start:-7px; top:calc(50% - 8px); width:16px; height:16px; background:var(--paper); transform:rotate(45deg); border-radius:3px}

/* shared */
.view{display:grid; gap:14px; margin-top:16px}
.card{background:var(--paper); border-radius:28px; box-shadow:0 6px 0 var(--sky-dark)}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.btn{--b:var(--orange); --bd:var(--orange-dark); border:0; border-radius:16px; padding:11px 18px; background:var(--b); color:var(--white); font-weight:800; font-size:1.12rem; box-shadow:0 4px 0 var(--bd); display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--bd)}
.btn svg{width:22px; height:22px; flex:none}
.btn.ghost{background:var(--paper); color:var(--ink); --bd:var(--sky-dark)}
.btn.wide{width:100%}
.round{width:58px; height:58px; border:0; border-radius:50%; background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--sky-dark); display:grid; place-items:center; flex:none}
.round:active{transform:translateY(3px); box-shadow:0 1px 0 var(--sky-dark)}
.round svg{width:28px; height:28px}
.stepper{display:flex; align-items:center; justify-content:space-between; gap:12px}
.count{font-weight:800; color:var(--ink-soft); font-size:1.1rem}
.note{display:grid; gap:10px; justify-items:start; background:var(--note); border-radius:16px; padding:10px 14px; font-size:.95rem; line-height:1.6; margin:0}
.note .btn{font-size:1rem; padding:8px 14px}

/* letters grid */
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (min-width:520px){ .grid{grid-template-columns:repeat(7,minmax(0,1fr))} }
.tile{aspect-ratio:1; max-width:100%; border:0; border-radius:18px; background:var(--paper); color:var(--c); font-family:var(--f-letter); font-weight:700; font-size:2.2rem; line-height:1; padding:0 0 6px; box-shadow:0 5px 0 var(--cd); display:grid; place-items:center; transition:transform .08s, box-shadow .08s}
.tile:active{transform:translateY(4px); box-shadow:0 1px 0 var(--cd)}

/* letter detail */
#detail{display:grid; gap:14px}
.back{justify-self:start}
.lcard{display:grid; justify-items:center; gap:10px; padding:22px 16px; text-align:center}
.bigletter{width:150px; height:150px; border-radius:50%; background:var(--c); color:var(--white); font-family:var(--f-letter); font-weight:700; font-size:92px; line-height:1; padding-bottom:14px; display:grid; place-items:center; box-shadow:0 6px 0 var(--cd)}
.lname{font-size:1.2rem; font-weight:800; color:var(--ink-soft)}
.pic{font-size:84px; line-height:1.1}
.word{font-family:var(--f-letter); font-weight:700; font-size:2.6rem; line-height:1.5; color:var(--ink)}
.word .first{color:var(--c)}
.tile.en, .bigletter.en, .word.en, .choice.en, .obj .badge.en{font-family:var(--f-ui); font-weight:800}
.tile.en{font-size:2.3rem; padding:0}
.bigletter.en{font-size:76px; padding:0 0 4px; letter-spacing:.02em}
.word.en{font-size:2.4rem; direction:ltr}
.choice.en{padding:0}
.lname.en{direction:ltr}
.word .blank{display:inline-block; font-family:var(--f-ui); background:var(--sun); color:var(--ink); border-radius:12px; padding-inline:.2em; margin-inline-end:.08em; line-height:1.25}

/* numbers */
.grid.nums{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile.num{font-size:2.5rem}
#ndetail{display:grid; gap:14px}
.countbox{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; width:100%; max-width:360px}
.obj{position:relative; aspect-ratio:1; max-width:100%; border:0; border-radius:16px; background:var(--sky); font-size:clamp(1.6rem,8vw,2.2rem); line-height:1; display:grid; place-items:center; padding:0; transition:transform .12s, background .12s}
.obj.done{background:var(--note); transform:scale(1.06)}
.obj .badge{position:absolute; top:-7px; inset-inline-end:-7px; min-width:26px; height:26px; border-radius:13px; background:var(--c); color:var(--white); font-family:var(--f-letter); font-weight:700; font-size:1rem; line-height:24px; padding-inline:5px; box-shadow:0 2px 0 var(--cd)}
.countbox.small{max-width:300px; gap:8px}
.countbox.small .obj{font-size:clamp(1.4rem,7vw,1.9rem)}

/* discover: colors, shapes, animals */
.dgrid{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.dtile{min-width:0; border:0; border-radius:18px; background:var(--paper); color:var(--ink); box-shadow:0 5px 0 var(--sky-dark); padding:10px 4px 8px; display:grid; justify-items:center; gap:6px; font-weight:800; font-size:.95rem; line-height:1.2; transition:transform .08s, box-shadow .08s}
.dtile:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sky-dark)}
.vis{width:72%; max-width:100%; aspect-ratio:1; display:grid; place-items:center; line-height:1}
.vis .emo{font-size:clamp(1.9rem,9.5vw,2.6rem)}
.blob{display:block; width:100%; height:100%; border-radius:52% 48% 50% 46% / 48% 54% 46% 52%; background:var(--k); box-shadow:inset -6px -8px 0 var(--shade), inset 6px 6px 0 var(--shine)}
.shape{display:block; width:100%; height:100%; overflow:visible}
#ddetail{display:grid; gap:14px}
.dvisual{width:150px; height:150px}
.dvisual .emo{font-size:112px}
.dname{font-size:2rem; font-weight:800; line-height:1.3}
.dfact{font-size:1.25rem; font-weight:700; color:var(--ink-soft); line-height:1.6}

/* games menu */
.games{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.gamecard{min-width:0; border:0; border-radius:24px; background:var(--paper); color:var(--ink); box-shadow:0 6px 0 var(--sky-dark); padding:14px 8px 12px; display:grid; justify-items:center; gap:8px; font-weight:800; font-size:1.1rem; transition:transform .08s, box-shadow .08s}
.gamecard:active{transform:translateY(4px); box-shadow:0 2px 0 var(--sky-dark)}
.gicon{width:76px; height:76px; border-radius:50%; background:var(--c); color:var(--white); display:grid; place-items:center; font-family:var(--f-letter); font-weight:700; font-size:2.2rem; line-height:1; padding-bottom:6px; box-shadow:0 4px 0 var(--cd)}
.gicon.emo{font-family:var(--f-ui); font-size:2.4rem; padding:0}
.games-head{grid-column:1/-1; margin:10px 4px 0; display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:1.3rem; font-weight:800}
.games-head .en{font-size:1rem; color:var(--ink-soft)}
.ask.en{font-size:2rem; line-height:1.2}
/* add and take away */
.mathpics{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px}
.grp{display:grid; grid-template-columns:repeat(var(--n),auto); gap:4px; background:var(--sky); border-radius:16px; padding:8px 10px; font-size:clamp(1.4rem,7vw,1.9rem); line-height:1.1}
.grp .it{position:relative; display:grid; place-items:center}
.grp .it i{font-style:normal}
.grp .it.gone i{opacity:.35; filter:grayscale(1)}
.grp .it.gone::after{content:""; position:absolute; left:-3px; right:-3px; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:var(--red); transform:rotate(-35deg)}
.mathpics .op, .eqn .op{font-family:var(--f-ui); font-weight:800; font-size:2rem; line-height:1; color:var(--ink-soft)}
.eqn{margin:0; display:flex; align-items:center; justify-content:center; gap:12px; font-family:var(--f-letter); font-weight:700; font-size:2.6rem; line-height:1.3}
.eqn .qm{min-width:1.3em; text-align:center; background:var(--sun); color:var(--ink); border-radius:14px; padding:0 .15em; transition:background .2s}
.eqn .qm.ok{background:var(--green); color:var(--white); animation:pop .45s ease}
#gameArea{display:grid; gap:14px}
.gamebar{display:flex; align-items:center; justify-content:space-between; gap:10px}
.gtitle{font-weight:800; font-size:1.2rem; min-width:0}
.choice .vis{width:64%}
.choice .vis .emo{font-size:clamp(2.6rem,13vw,3.6rem)}

/* welcome */
.welcome{position:fixed; inset:0; z-index:15; overflow-y:auto; display:grid; place-items:center;
  padding-inline:16px; padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(90px 34px at 14% 12%, rgba(255,255,255,.8) 60%, transparent 63%),
    radial-gradient(110px 38px at 84% 26%, rgba(255,255,255,.7) 60%, transparent 63%),
    radial-gradient(80px 28px at 22% 78%, rgba(255,255,255,.55) 60%, transparent 63%),
    var(--sky)}
.wl-inner{width:100%; max-width:420px; display:grid; justify-items:center; gap:12px; text-align:center}
.wl-title{font-size:2.5rem}
.zizo-hero{width:180px; height:186px; overflow:visible; transform-origin:50% 90%; animation:enter .9s cubic-bezier(.3,1.4,.5,1) both, sway 2.6s 1s ease-in-out infinite}
.zizo-hero .ear{transform-box:fill-box; transform-origin:center; animation:flap 2.2s ease-in-out infinite}
.wl-hello{margin:0; font-size:1.8rem; font-weight:800; line-height:1.35; text-wrap:balance}
.wl-stars{display:inline-flex; align-items:center; gap:6px; background:var(--sun); border-radius:999px; padding:4px 16px; font-weight:800; font-size:1.2rem; box-shadow:0 3px 0 var(--sun-dark); font-variant-numeric:tabular-nums}
.wl-stars svg{width:22px; height:22px; color:var(--white)}
#wlMain{width:100%; display:grid; justify-items:center; gap:14px}
.wl-actions{width:100%; display:grid; gap:14px}
.btn.big{width:100%; flex-direction:column; gap:2px; font-size:1.45rem; padding:14px 18px 12px; border-radius:22px; box-shadow:0 6px 0 var(--bd)}
.btn.big small{font-size:1rem; font-weight:700; opacity:.92}
.btn.big .bigrow{display:flex; align-items:center; gap:10px}
.btn.big svg{width:30px; height:30px}
.linkbtn{border:0; background:none; color:var(--ink-soft); font-family:inherit; font-weight:700; font-size:1rem; text-decoration:underline; padding:8px}
.setup{width:100%; padding:20px 16px; display:grid; gap:12px; animation:pop .4s ease}
.setup label{font-weight:800; font-size:1.35rem}
.setup input{width:100%; box-sizing:border-box; font-family:var(--f-ui); font-size:1.5rem; font-weight:700; text-align:center; color:var(--ink); background:var(--paper); border:3px solid var(--sky-dark); border-radius:16px; padding:10px 14px; -webkit-user-select:text; user-select:text}
.setup input:focus{outline:none; border-color:var(--blue)}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg button{border:0; border-radius:16px; padding:12px 8px; font-weight:800; font-size:1.2rem; background:var(--sky); color:var(--ink); box-shadow:0 4px 0 var(--sky-dark)}
.seg button[aria-pressed="true"]{background:var(--green); color:var(--white); box-shadow:0 4px 0 var(--green-dark)}
.setup-note{margin:0; color:var(--ink-soft); font-size:.9rem}
@keyframes enter{from{transform:translateY(70px) scale(.6); opacity:0} to{transform:none; opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)}}

/* Zizo's journey (stage map) */
.journey-card{grid-column:1/-1; min-width:0; border:0; border-radius:24px; background:var(--orange); color:var(--white); box-shadow:0 6px 0 var(--orange-dark); padding:14px 16px; display:flex; align-items:center; gap:14px; text-align:start; font-family:inherit}
.journey-card:active{transform:translateY(4px); box-shadow:0 2px 0 var(--orange-dark)}
.journey-card .jicon{font-size:3rem; line-height:1; flex:none}
.journey-card .jtext{display:grid; gap:4px; min-width:0; flex:1}
.journey-card b{font-size:1.4rem; font-weight:800}
.journey-card span{font-weight:700; font-size:1rem}
.daily-card{background:var(--sun); color:var(--ink); box-shadow:0 6px 0 var(--sun-dark)}
.daily-card:active{box-shadow:0 2px 0 var(--sun-dark)}
.daily-card.done{background:var(--paper); box-shadow:0 6px 0 var(--sky-dark)}
.journey-card .streak, .daily-wl .streak{flex:none; background:var(--paper); color:var(--ink); border-radius:999px; padding:2px 12px; font-weight:800; font-size:1.15rem; box-shadow:0 2px 0 var(--sun-dark)}
.daily-card.done .streak{background:var(--sun)}
.streak:empty{display:none}
.btn.daily-wl{width:100%; gap:10px; font-size:1.25rem; padding:12px 16px; border-radius:20px}
.jbar{height:10px; border-radius:5px; background:rgba(255,255,255,.35); overflow:hidden}
.jbar i{display:block; height:100%; background:var(--white); border-radius:5px}
.map{position:relative; overflow:hidden; border-radius:28px; box-shadow:0 6px 0 var(--sky-dark)}
.region{position:absolute; left:0; right:0}
.region-name{position:absolute; top:12px; inset-inline-start:12px; z-index:2; background:var(--paper); color:var(--ink); border-radius:999px; padding:3px 14px; font-weight:800; font-size:1rem; box-shadow:0 3px 0 var(--shade)}
.deco{position:absolute; font-size:2.1rem; line-height:1; pointer-events:none}
.road{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.node{position:absolute; z-index:3; width:64px; height:64px; margin-left:-32px; margin-bottom:-32px; border:0; border-radius:50%; background:var(--c); color:var(--white); box-shadow:0 5px 0 var(--cd); font-family:var(--f-letter); font-weight:700; font-size:1.8rem; line-height:1; padding-bottom:6px; display:grid; place-items:center}
.node:active{margin-bottom:-36px; box-shadow:0 1px 0 var(--cd)}
.node.locked{--c:var(--lock); --cd:var(--lock-dark)}
.node.locked svg{width:24px; height:24px}
.node.current{width:80px; height:80px; margin-left:-40px; margin-bottom:-40px; font-size:2.2rem; --c:var(--pink); --cd:var(--pink-dark); animation:pulse 1.8s ease-in-out infinite}
.node.current:active{margin-bottom:-44px}
.nstars{position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); display:flex; gap:1px; color:var(--sun)}
.nstars svg{width:17px; height:17px; filter:drop-shadow(0 1px 0 var(--sun-dark))}
.nstars .off{color:var(--paper); filter:none; opacity:.85}
.map-zizo{position:absolute; z-index:4; width:58px; height:60px; margin-left:-29px; overflow:visible; pointer-events:none; animation:bob 2s ease-in-out infinite}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
.choices.four .choice{font-size:clamp(2rem,9vw,2.8rem); border-radius:20px}
.endstars .off{color:var(--sky-dark); filter:none}

/* Zizo's prizes */
.wardrobe-top{display:flex; align-items:center; gap:14px; padding:16px}
.zizo-big{width:128px; height:132px; flex:none; overflow:visible}
.prog{flex:1; min-width:0; display:grid; gap:8px}
.prog-title{margin:0; font-weight:800; font-size:1.2rem; line-height:1.4}
.prog-next{margin:0; color:var(--ink-soft); font-weight:700; line-height:1.5}
.wallet{justify-self:start; margin:0; display:inline-flex; align-items:center; gap:6px; background:var(--sun); color:var(--ink); border-radius:999px; padding:3px 16px; font-weight:800; font-size:1.5rem; line-height:1.4; box-shadow:0 3px 0 var(--sun-dark); font-variant-numeric:tabular-nums}
.wallet svg{width:26px; height:26px; color:var(--white)}
.modal-card .wallet{justify-self:center}
.modal-note{margin:0 0 6px; color:var(--ink-soft); font-weight:700; font-size:1.1rem}
.shelf-h{margin:6px 0 0; font-size:1.2rem; font-weight:800}
.shelf{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.prize{position:relative; min-width:0; border:0; border-radius:20px; background:var(--paper); color:var(--ink); box-shadow:0 5px 0 var(--sky-dark); padding:10px 6px 10px; display:grid; justify-items:center; gap:4px; font-weight:800; font-size:.95rem; line-height:1.3}
.prize:active{transform:translateY(3px); box-shadow:0 2px 0 var(--sky-dark)}
.prize .mini{width:100%; max-width:84px; height:auto; aspect-ratio:120/124; overflow:visible}
.prize[aria-pressed="true"]{box-shadow:0 0 0 4px var(--green), 0 5px 0 var(--green-dark)}
.prize.cant .mini{filter:grayscale(1) opacity(.4)}
.prize.cant .pname{color:var(--ink-soft)}
.prize .price{position:absolute; top:6px; inset-inline-start:6px; display:inline-flex; align-items:center; gap:3px; background:var(--sun); border-radius:999px; padding:1px 8px; font-size:.95rem; box-shadow:0 2px 0 var(--sun-dark); font-variant-numeric:tabular-nums}
.prize .price svg{width:13px; height:13px; color:var(--white)}
.prize.cant .price{background:var(--sky); box-shadow:0 2px 0 var(--sky-dark)}
.prize.cant .price svg{color:var(--sky-dark)}
.prize.can{box-shadow:0 0 0 3px var(--sun), 0 5px 0 var(--sun-dark)}
.stars{position:relative}
.stars.can-buy::after{content:""; position:absolute; top:-4px; inset-inline-end:-4px; width:14px; height:14px; border-radius:50%; background:var(--pink); box-shadow:0 0 0 2.5px var(--paper); animation:pulse 1.8s ease-in-out infinite}
.prize .tick{position:absolute; top:6px; inset-inline-end:6px; width:24px; height:24px; border-radius:50%; background:var(--green); color:var(--white); display:grid; place-items:center}
.prize .tick svg{width:16px; height:16px}
.endnext{margin:0 0 4px; color:var(--ink-soft); font-weight:700}
.modal{position:fixed; inset:0; z-index:20; background:var(--scrim); display:grid; place-items:center; padding:16px}
.modal-card{width:100%; max-width:340px; padding:22px 16px; display:grid; justify-items:center; gap:8px; text-align:center; animation:pop .45s ease}
.modal-kicker{margin:0; color:var(--orange); font-weight:800; font-size:1.35rem}
.modal-card h2{margin:0 0 6px; font-size:1.5rem; font-weight:800}

/* play */
.chips{display:flex; gap:6px; background:var(--paper); padding:6px; border-radius:999px; box-shadow:0 4px 0 var(--sky-dark)}
.chip{flex:1; min-width:0; border:0; border-radius:999px; padding:9px 6px; background:transparent; color:var(--ink-soft); font-weight:800; font-size:1rem; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green); color:var(--white)}
.chips.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-radius:26px}
.dots{display:flex; gap:10px; justify-content:center}
.dot{width:16px; height:16px; border-radius:50%; background:var(--sky-dark); transition:background .2s}
.dot.now{background:var(--orange)}
.dot.done{background:var(--green)}
#playArea{display:grid; gap:16px}
.prompt{display:grid; justify-items:center; gap:10px; padding:20px 16px; text-align:center}
.speak-big{width:112px; height:112px; border:0; border-radius:50%; background:var(--c); color:var(--white); box-shadow:0 6px 0 var(--cd); display:grid; place-items:center; animation:pulse 2.2s ease-in-out infinite}
.speak-big svg{width:54px; height:54px}
.ask{margin:0; font-size:1.3rem; font-weight:800}
.choices{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.choice{aspect-ratio:1; max-width:100%; border:0; border-radius:26px; background:var(--paper); color:var(--ink); font-family:var(--f-letter); font-weight:700; font-size:clamp(2.6rem,12vw,3.6rem); line-height:1; padding:0 0 8px; box-shadow:0 6px 0 var(--sky-dark); display:grid; place-items:center; transition:transform .08s}
.choice:active{transform:translateY(4px)}
.choice.right{background:var(--green); color:var(--white); box-shadow:0 6px 0 var(--green-dark); animation:pop .45s ease}
.choice.wrong{opacity:.4; animation:shake .45s ease}
.end{display:grid; justify-items:center; gap:8px; padding:26px 16px; text-align:center}
.end h2{margin:0; font-size:1.8rem; font-weight:800}
.end p{margin:0 0 8px; font-size:1.15rem; color:var(--ink-soft); font-weight:700}
.endstars{display:flex; gap:6px; color:var(--sun)}
.endstars svg{width:42px; height:42px; filter:drop-shadow(0 3px 0 var(--sun-dark))}
.endstars span{animation:pop .5s ease backwards}
.endstars span:nth-child(2){animation-delay:.12s} .endstars span:nth-child(3){animation-delay:.24s}
.endstars span:nth-child(4){animation-delay:.36s} .endstars span:nth-child(5){animation-delay:.48s}

/* trace */
.tlabel{border:0; background:var(--paper); color:var(--ink); border-radius:999px; padding:10px 18px; font-weight:800; font-size:1.15rem; display:inline-flex; align-items:center; gap:8px; box-shadow:0 4px 0 var(--sky-dark); min-width:0}
.tlabel svg{width:22px; height:22px; color:var(--pink); flex:none}
.canvas-wrap{display:flex; justify-content:center}
#cv{display:block; background:var(--paper); border-radius:28px; box-shadow:0 6px 0 var(--sky-dark); touch-action:none; max-width:100%}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--paper); box-shadow:0 -4px 0 var(--sky-dark); display:flex; justify-content:center; gap:6px; padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tab{flex:1; min-width:0; max-width:140px; border:0; border-radius:18px; padding:8px 2px 6px; background:transparent; color:var(--ink-soft); font-weight:800; font-size:1rem; display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.2}
.tab svg{width:28px; height:28px}
.tab[aria-current="page"]{background:var(--tc); color:var(--white)}

/* effects */
#fx{position:fixed; left:50%; top:42%; width:0; height:0; pointer-events:none; z-index:30}
.spark{position:absolute; width:30px; height:30px; margin:-15px; animation:spark .9s ease-out forwards}
.spark svg{width:100%; height:100%}

@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-14px) rotate(-5deg)}60%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
@keyframes tilt{25%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
@keyframes flap{0%,84%,100%{transform:rotate(0)}89%{transform:rotate(-9deg)}94%{transform:rotate(7deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes spark{from{transform:translate(0,0) scale(.3); opacity:1} to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(45deg); opacity:0}}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>حروف <span>زيزو</span></h1>
      <button class="stars" id="starPill" aria-label="متجر زيزو">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>
        <span id="starCount">٠</span>
        <svg class="gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5h14l-1.3 12H6.3z"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/></svg>
      </button>
    </div>
    <div class="host">
      <svg class="zizo" viewBox="0 0 120 120" aria-hidden="true">
        <g class="ear"><ellipse cx="95" cy="60" rx="22" ry="27" fill="var(--zizo-dark)"/><ellipse cx="96" cy="61" rx="13" ry="17" fill="var(--blush)"/></g>
        <g class="ear"><ellipse cx="25" cy="60" rx="22" ry="27" fill="var(--zizo-dark)"/><ellipse cx="24" cy="61" rx="13" ry="17" fill="var(--blush)"/></g>
        <circle cx="60" cy="60" r="33" fill="var(--zizo)"/>
        <rect x="31" y="86" width="58" height="13" rx="6.5" fill="var(--orange)"/>
        <path d="M37 89v7M43 89v7M49 89v7M71 89v7M77 89v7M83 89v7" stroke="var(--orange-dark)" stroke-width="2" stroke-linecap="round"/>
        <rect x="68" y="93" width="12" height="22" rx="4" fill="var(--orange)" transform="rotate(-14 74 104)"/>
        <path d="M70 110h10" stroke="var(--orange-dark)" stroke-width="2" stroke-linecap="round" transform="rotate(-14 74 104)"/>
        <path d="M60 66 C59 84 62 95 74 97" fill="none" stroke="var(--zizo)" stroke-width="13" stroke-linecap="round"/>
        <path d="M55 79h9M56 86h8" stroke="var(--zizo-dark)" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="40" cy="69" rx="6" ry="3.5" fill="var(--blush)"/>
        <ellipse cx="80" cy="69" rx="6" ry="3.5" fill="var(--blush)"/>
        <circle cx="47" cy="57" r="5.5" fill="var(--ink)"/><circle cx="73" cy="57" r="5.5" fill="var(--ink)"/>
        <circle cx="49" cy="55" r="1.8" fill="var(--white)"/><circle cx="75" cy="55" r="1.8" fill="var(--white)"/>
        <path d="M45 74q5 5 10 1" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M36 41C37 19 83 19 84 41Z" fill="var(--orange)"/>
        <rect x="33" y="36" width="54" height="9" rx="4.5" fill="var(--orange-dark)"/>
        <circle cx="60" cy="20" r="6.5" fill="var(--orange-dark)"/>
      </svg>
      <p class="bubble" id="bubble" aria-live="polite">أهلاً! أنا زيزو الفيل. اضغط على أي حرف لنتعلّمه معاً</p>
    </div>
  </header>

  <main>
    <section id="v-letters" class="view">
      <div id="voiceNote" class="note" hidden></div>
      <div class="chips" role="group" aria-label="اللغة">
        <button class="chip lchip" data-lang="ar" aria-pressed="true">العربية</button>
        <button class="chip lchip" data-lang="en" aria-pressed="false">English</button>
      </div>
      <div id="grid" class="grid" aria-label="الحروف"></div>
      <div id="detail" hidden>
        <button class="btn ghost back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          كل الحروف
        </button>
        <div class="card lcard">
          <div class="bigletter" id="dLetter"></div>
          <div class="lname" id="dName"></div>
          <div class="pic" id="dPic" aria-hidden="true"></div>
          <div class="word" id="dWord"></div>
          <div class="btnrow">
            <button class="btn" id="sayLetterBtn"><span class="ico-spk"></span>اسمع الحرف</button>
            <button class="btn" id="sayWordBtn" style="--b:var(--blue);--bd:var(--blue-dark)"><span class="ico-spk"></span>اسمع الكلمة</button>
          </div>
        </div>
        <div class="stepper">
          <button class="round" id="prevL" aria-label="الحرف السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
          <span class="count" id="dCount"></span>
          <button class="round" id="nextL" aria-label="الحرف التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        </div>
        <button class="btn wide" id="toTrace" style="--b:var(--pink);--bd:var(--pink-dark)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>
          ارسم هذا الحرف
        </button>
      </div>
    </section>

    <section id="v-numbers" class="view" hidden>
      <div class="chips" role="group" aria-label="اللغة">
        <button class="chip nchip" data-lang="ar" aria-pressed="true">العربية</button>
        <button class="chip nchip" data-lang="en" aria-pressed="false">English</button>
      </div>
      <div id="ngrid" class="grid nums" aria-label="الأرقام"></div>
      <div id="ndetail" hidden>
        <button class="btn ghost back" id="nbackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          كل الأرقام
        </button>
        <div class="card lcard">
          <div class="bigletter" id="nDigit"></div>
          <div class="lname" id="nName"></div>
          <div class="countbox" id="nBox" aria-label="اضغط على كل صورة لتعدّها"></div>
          <div class="btnrow">
            <button class="btn" id="sayNumBtn"><span class="ico-spk"></span>اسمع الرقم</button>
            <button class="btn" id="countWithMe" style="--b:var(--blue);--bd:var(--blue-dark)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v6"/><path d="M12 10.5V4a1.5 1.5 0 0 1 3 0v7"/><path d="M15 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.6 1.6 0 0 1 2.4-2l2.6 2.6V7.5a1.5 1.5 0 0 1 3 0"/></svg>
              عُدّ معي
            </button>
          </div>
        </div>
        <div class="stepper">
          <button class="round" id="prevN" aria-label="الرقم السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
          <span class="count" id="nCount"></span>
          <button class="round" id="nextN" aria-label="الرقم التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        </div>
        <button class="btn wide" id="toTraceN" style="--b:var(--pink);--bd:var(--pink-dark)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>
          ارسم هذا الرقم
        </button>
      </div>
    </section>

    <section id="v-discover" class="view" hidden>
      <div class="chips grid3" role="group" aria-label="ماذا نكتشف؟">
        <button class="chip dchip" data-topic="colors" aria-pressed="true">الألوان</button>
        <button class="chip dchip" data-topic="shapes" aria-pressed="false">الأشكال</button>
        <button class="chip dchip" data-topic="animals" aria-pressed="false">الحيوانات</button>
        <button class="chip dchip" data-topic="foods" aria-pressed="false">فواكه وخضار</button>
        <button class="chip dchip" data-topic="body" aria-pressed="false">جسمي</button>
        <button class="chip dchip" data-topic="jobs" aria-pressed="false">المهن</button>
      </div>
      <div id="dgrid" class="grid dgrid"></div>
      <div id="ddetail" hidden>
        <button class="btn ghost back" id="dbackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span id="dbackText"></span>
        </button>
        <div class="card lcard">
          <div class="vis dvisual" id="dVisual"></div>
          <div class="dname" id="xName"></div>
          <div class="dfact" id="dFact"></div>
          <div class="btnrow">
            <button class="btn" id="sayDBtn"><span class="ico-spk"></span>اسمع</button>
          </div>
        </div>
        <div class="stepper">
          <button class="round" id="prevD" aria-label="السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
          <span class="count" id="dCountD"></span>
          <button class="round" id="nextD" aria-label="التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        </div>
        <button class="btn wide" id="toGameD" style="--b:var(--green);--bd:var(--green-dark)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="18" cy="13.8" r="1.1" fill="currentColor" stroke="none"/></svg>
          <span id="toGameText"></span>
        </button>
      </div>
    </section>

    <section id="v-play" class="view" hidden>
      <div id="gameMenu" class="games" aria-label="الألعاب"></div>
      <div id="mapArea" class="view" hidden>
        <div class="gamebar">
          <button class="btn ghost" id="mapBack">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            كل الألعاب
          </button>
          <span class="gtitle">رحلة زيزو</span>
        </div>
        <div class="map" id="map" aria-label="خريطة المراحل"></div>
      </div>
      <div id="gameArea" hidden>
      <div class="gamebar">
        <button class="btn ghost" id="gamesBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span id="gamesBackText">كل الألعاب</span>
        </button>
        <span class="gtitle" id="gTitle"></span>
      </div>
      <div class="dots" id="dots"></div>
      <div id="playArea">
        <div class="card prompt" id="prompt"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="card end" id="endArea" hidden>
        <div class="endstars" id="endStars"></div>
        <h2 id="endTitle">أحسنت يا بطل!</h2>
        <p id="endSub"></p>
        <p class="endnext" id="endNext"></p>
        <div class="btnrow">
          <button class="btn" id="again" style="--b:var(--green);--bd:var(--green-dark)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
            العب مرة أخرى
          </button>
          <button class="btn" id="toRewards" style="--b:var(--sun);--bd:var(--sun-dark);color:var(--ink)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5h14l-1.3 12H6.3z"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/></svg>
            متجر زيزو
          </button>
        </div>
      </div>
      <div class="card end" id="stageEnd" hidden>
        <div class="endstars" id="stageStars"></div>
        <h2 id="stageTitle"></h2>
        <p id="stageSub"></p>
        <div class="btnrow">
          <button class="btn" id="stageNext" style="--b:var(--green);--bd:var(--green-dark)">المرحلة التالية</button>
          <button class="btn ghost" id="stageRetry">أعد المرحلة</button>
          <button class="btn ghost" id="stageMap">الخريطة</button>
        </div>
      </div>
      </div>
    </section>

    <section id="v-rewards" class="view" hidden>
      <div class="card wardrobe-top">
        <svg class="zizo-big" id="bigZizo" viewBox="0 -4 120 124" aria-hidden="true"></svg>
        <div class="prog">
          <p class="prog-title">متجر زيزو</p>
          <p class="wallet" id="wallet"></p>
          <p class="prog-next" id="progNext"></p>
        </div>
      </div>
      <h2 class="shelf-h">القبعات</h2>
      <div class="shelf" id="shelf-hat"></div>
      <h2 class="shelf-h">الأوشحة</h2>
      <div class="shelf" id="shelf-scarf"></div>
      <h2 class="shelf-h">الإضافات</h2>
      <div class="shelf" id="shelf-extra"></div>
    </section>

    <section id="v-trace" class="view" hidden>
      <div class="chips" role="group" aria-label="ماذا نرسم؟">
        <button class="chip tchip" data-kind="letters" aria-pressed="true">الحروف</button>
        <button class="chip tchip" data-kind="numbers" aria-pressed="false">الأرقام</button>
        <button class="chip tchip" data-kind="en" aria-pressed="false">ABC</button>
        <button class="chip tchip" data-kind="enNum" aria-pressed="false">123</button>
      </div>
      <div class="stepper">
        <button class="round" id="prevT" aria-label="الحرف السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="tlabel" id="tLabel"><span id="tLabelText"></span><span class="ico-spk"></span></button>
        <button class="round" id="nextT" aria-label="الحرف التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      </div>
      <div class="canvas-wrap" id="cWrap"><canvas id="cv" aria-label="لوحة الرسم: ارسم فوق الحرف بإصبعك"></canvas></div>
      <div class="btnrow">
        <button class="btn ghost" id="clearT">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M14.5 4.5l5 5-8.5 8.5H6l-2.5-2.5z"/></svg>
          امسح
        </button>
        <button class="btn" id="doneT" style="--b:var(--green);--bd:var(--green-dark)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          انتهيت
        </button>
      </div>
    </section>
  </main>

  /* ---------- numbers ---------- */
  // A box of n pictures; tapping each one counts it out loud. onDone runs when all are counted.
  var countTimers = [];
  function stopAutoCount(){ countTimers.forEach(clearTimeout); countTimers = []; }
  function countBox(box, n, pic, onDone, en){
    var names = en ? ENN : N;
    box.innerHTML = '';
    var counted = 0;
    var objs = [];
    for (var k = 0; k < n; k++){
      var b = document.createElement('button');
      b.className = 'obj'; b.type = 'button'; b.textContent = pic;
      b.setAttribute('aria-label', 'عُدّ');
      (function(btn){
        btn.addEventListener('click', function(){ tapObj(btn, false); });
      })(b);
      objs.push(b); box.appendChild(b);
    }
    function tapObj(btn, auto){
      if (btn.classList.contains('done')) return;
      counted++;
      btn.classList.add('done');
      var badge = document.createElement('span');
      badge.className = 'badge' + (en ? ' en' : ''); badge.textContent = names[counted - 1].d;
      btn.appendChild(badge);
      if (counted === n && onDone && !auto) onDone(auto);
      else if (en) sayEn(names[counted - 1].w);
      else say(names[counted - 1].s);
    }
    return {
      reset: function(){ counted = 0; objs.forEach(function(o){ o.classList.remove('done'); var bd = o.querySelector('.badge'); if (bd) bd.remove(); }); },
      auto: function(stepMs, then){
        this.reset();
        objs.forEach(function(o, k){ countTimers.push(setTimeout(function(){ tapObj(o, true); }, 400 + k*stepMs)); });
        if (then) countTimers.push(setTimeout(then, 400 + n*stepMs + 600));
      }
    };
  }

  $('prevT').addEventListener('click', function(){ setTrace(tIdx - 1, true); });
  $('nextT').addEventListener('click', function(){ setTrace(tIdx + 1, true); });
  $('tLabel').addEventListener('click', function(){ tSay(tIdx); });
  $('clearT').addEventListener('click', function(){ if (traceDone) return; strokes = []; drawAll(); });
  $('doneT').addEventListener('click', function(){
    if (traceDone) return;
    var isNum = tIsNum();
    var n = strokes.reduce(function(a, s){ return a + s.length; }, 0);
    if (n < 12){
      zizo(isNum ? 'ارسم فوق الرقم بإصبعك أولاً' : 'ارسم فوق الحرف بإصبعك أولاً', 'sad');
      say(isNum ? 'ارْسُمْ فَوْقَ الرَّقْم' : 'ارْسُمْ فَوْقَ الحَرْف');
      return;
    }
    var sc = traceScore();
    var what = isNum ? 'الرقم' : 'الحرف';
    if (sc.inside < TRACE_INSIDE){
      // Drawing that doesn't follow the letter's shape: clear it and try again on the dots
      strokes = []; drawAll();
      if (sc.inside < 0.6){
        zizo('خرجت بعيداً عن ' + what + '. ارسم فوق النقاط فقط', 'sad');
        say('ارْسُمْ فَوْقَ النِّقاطِ فَقَط');
      } else {
        zizo('قريب! هذا ليس شكل ' + what + '. ارسم بهدوء فوق النقاط', 'sad');
        say('ارْسُمْ بِهُدُوءٍ فَوْقَ النِّقاط');
      }
      return;
    }
    if (sc.cover < TRACE_COVER){
      // On the letter but not finished: keep what they drew and let them complete it
      zizo('أحسنت البداية! أكمل رسم ' + what + ' كله', 'sad');
      say(isNum ? 'أَكْمِلْ رَسْمَ الرَّقْمِ كُلِّه' : 'أَكْمِلْ رَسْمَ الحَرْفِ كُلِّه');
      return;
    }
    if (!sc.dots){
      // Dots tell letters apart (ب ت ث), so they count
      var ar = tKind === 'letters';
      var many = ar && 'تثشقي'.indexOf(L[tIdx].c) !== -1, kaf = ar && L[tIdx].c === 'ك';
      var dont = gx('لا تنسَ', 'لا تنسَي');
      zizo(kaf ? 'رائع! ' + dont + ' الرسمة الصغيرة داخل الكاف' : many ? 'رائع! ' + dont + ' النقاط' : 'رائع! ' + dont + ' النقطة', 'sad');
      var dontS = gx('لا تَنْسَ', 'لا تَنْسَيْ');
      say(kaf ? dontS + ' الرَّسْمَةَ الصَّغِيرَة' : many ? dontS + ' النِّقاط' : dontS + ' النُّقْطَة');
      return;
    }
    traceDone = true; drawAll();
    var pr = praise(); addStar(); zizo(pr, 'happy'); say(pr);
    traceTimer = setTimeout(function(){ whenNoPrize(function(){ setTrace(tIdx + 1, true); }); }, 1600);
  });
  if (window.ResizeObserver) new ResizeObserver(function(){ if (!$('v-trace').hidden) sizeCanvas(); }).observe($('cWrap'));
  if (document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('700 100px "Noto Naskh Arabic"', 'بت'),
      document.fonts.load('700 100px "Baloo Bhaijaan 2"', 'AB12')
    ]).then(function(){ if (!$('v-trace').hidden) drawAll(); }).catch(function(){});
  }

  /* ---------- navigation ---------- */
  var currentView = 'letters';
  function show(v){
    currentView = v;
    clearTimeout(nextTimer); clearTimeout(traceTimer); stopAutoCount();
    afterPrize = null;
    ['letters','numbers','discover','play','trace','rewards'].forEach(function(k){ $('v-' + k).hidden = (k !== v); });
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-current', t.dataset.v === v ? 'page' : 'false'); });
    window.scrollTo(0, 0);
    if (v === 'letters') backToGrid();
    if (v === 'numbers') backToNumbers();
    if (v === 'rewards'){ renderRewards(); zizo(gx('هذا متجري! اختر ما تشتريه لي بنجومك', 'هذا متجري! اختاري ما تشترينه لي بنجومك')); }
    if (v === 'discover') backToD();
    if (v === 'play') showGameMenu();
    if (v === 'trace'){ lastW = 0; sizeCanvas(); setTrace(tIdx, false); }
  }
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ show(t.dataset.v); }); });

  /* ---------- welcome ---------- */
  var welcome = $('welcome'), pickedG = kid.g;
  function setG(g){
    pickedG = g;
    document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.g === g)); });
  }
  document.querySelectorAll('.seg button').forEach(function(b){ b.addEventListener('click', function(){ setG(b.dataset.g); }); });
  function showWelcome(){
    hush();
    $('heroZizo').innerHTML = zizoMarkup(outfit);
    $('wlStars').textContent = fmt(stars);
    $('wlStage').textContent = stageText();
    var st = streakNow();
    $('wlDaily').textContent = dailyDone() ? 'تحدّي اليوم ✓' : 'تحدّي اليوم: ٥ نجوم إضافية';
    $('wlStreak').textContent = st ? '🔥 ' + fmt(st) : '';
    $('goDaily').setAttribute('aria-label', 'تحدّي اليوم' + (dailyDone() ? '، تمّ اليوم' : '') + (st ? '، ' + daysText(st) : ''));
    welcome.hidden = false; welcome.scrollTop = 0;
    if (!kid.set){ openSetup(true); return; }
    $('setup').hidden = true; $('wlMain').hidden = false;
    $('wlHello').textContent = 'أهلاً يا ' + hero() + '!';
    say(kid.name ? 'أَهْلاً يا ' + kid.name + '! هَيّا نَلْعَب' : gx('أَهْلاً يا بَطَل! هَيّا نَلْعَب', 'أَهْلاً يا بَطَلَة! هَيّا نَلْعَب'));
  }
  function openSetup(firstTime){
    $('wlMain').hidden = true; $('setup').hidden = false;
    $('kidName').value = kid.name; setG(kid.g);
    $('wlHello').textContent = firstTime ? 'أهلاً! أنا زيزو الفيل' : 'تغيير الاسم';
    if (firstTime) say('أَهْلاً! أَنا زِيزُو الفِيل. ما اسْمُك؟');
  }
  function leaveWelcome(){ welcome.hidden = true; }
  $('setup').addEventListener('submit', function(e){
    e.preventDefault();
    kid.name = $('kidName').value.replace(/\s+/g, ' ').trim().slice(0, 20);
    kid.g = pickedG; kid.set = true; saveKid();
    try { $('kidName').blur(); } catch(_){}
    showWelcome();
  });
  $('skipName').addEventListener('click', function(){
    if (!kid.set){ kid.set = true; kid.g = pickedG; saveKid(); }
    showWelcome();
  });
  $('editName').addEventListener('click', function(){ openSetup(false); });
  $('goJourney').addEventListener('click', function(){ leaveWelcome(); show('play'); showMap(); });
  $('goDaily').addEventListener('click', function(){ leaveWelcome(); show('play'); startDaily(); });
  $('goLearn').addEventListener('click', function(){
    leaveWelcome(); show('letters');
    zizo('أهلاً يا ' + hero() + '! اضغط على أي حرف لنتعلّمه معاً');
  });

  // Android back button: close what's open, then go back to the welcome screen, then leave the app.
  if (AppPlugin){
    AppPlugin.addListener('backButton', function(){
      if (prizeOpen()){ closePrize(); return; }
      if (!welcome.hidden){
        if (!$('setup').hidden && kid.set) showWelcome();
        else AppPlugin.exitApp();
        return;
      }
      if (currentView === 'letters' && !detail.hidden){ hush(); backToGrid(); }
      else if (currentView === 'numbers' && !ndetail.hidden){ hush(); backToNumbers(); }
      else if (currentView === 'discover' && !ddetail.hidden){ hush(); backToD(); }
      else if (currentView === 'play' && !$('gameArea').hidden){ hush(); if (stage !== null) showMap(); else showGameMenu(); }
      else if (currentView === 'play' && !$('mapArea').hidden){ hush(); showGameMenu(); }
      else showWelcome();
    });
    AppPlugin.addListener('pause', hush);
  }

  renderStars();
  renderZizo();
  show('letters');
  showWelcome();
  if (hasWebTTS) setTimeout(updateWebNote, 1500);
  else if (!NTTS && !isNative) updateWebNote();
})();
</script>
</body>
</html>
