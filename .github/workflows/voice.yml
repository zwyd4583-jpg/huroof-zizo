name: Make Zizo's voice

# Run by hand (Actions > Make Zizo's voice > Run workflow) with the list of phrases to record.
# The MP3 files are pushed to the branch "voice-out".
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Phrase list (JSON) in the repository"
        default: "voice/samples.json"
        required: true

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Piper (offline speech engine)
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts onnxruntime
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record the phrases
        run: python scripts/make_voice.py "${{ inputs.list }}" out

      - name: Save to the voice-out branch
        run: |
          cd out
          git init -q
          git checkout -q -b voice-out
          git add -A
          git -c user.name="zizo-voice" -c user.email="zizo-voice@users.noreply.github.com" commit -qm "Voice from ${{ inputs.list }} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-out
