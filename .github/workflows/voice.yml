name: Make Zizo's voice

# Run by hand (Actions > Make Zizo's voice > Run workflow) with the list of phrases to record.
# The work is split over several machines; the MP3 files are pushed to the branch "voice-out-<list name>".
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Phrase list (JSON) in the repository"
        default: "voice/samples.json"
        required: true
      shards:
        description: "How many machines share the work (1-20)"
        default: "1"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          n=${{ inputs.shards }}
          python3 -c "import json; print('shards=' + json.dumps(list(range(int('$n')))))" >> "$GITHUB_OUTPUT"

  voice:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the speech engine
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ inputs.list }}" ] && grep -q '"engine": *"chatterbox"' "${{ inputs.list }}"; then
            pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install chatterbox-tts
          elif [ -f "${{ inputs.list }}" ] && grep -q '"engine": *"google"' "${{ inputs.list }}"; then
            echo "Google voices: nothing to install"
          else
            pip install piper-tts onnxruntime
          fi
          if [ -f "${{ inputs.list }}" ] && grep -q '"qa": *true' "${{ inputs.list }}"; then pip install openai-whisper; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record the phrases
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          if [ "${{ inputs.list }}" = "debug" ]; then python scripts/voice_debug.py out; else
          python scripts/make_voice.py "${{ inputs.list }}" out ${{ matrix.shard }} ${{ inputs.shards }}; fi

      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.shard }}
          path: out/

  save:
    needs: voice
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Join the parts and push them to the voice-out branch
        run: |
          mkdir out
          for d in parts/*/; do cp -r "$d"/. out/; done
          cat out/report-*.tsv > out/report.tsv 2>/dev/null || true
          cat out/qa-*.tsv > out/qa.tsv 2>/dev/null || true
          cd out
          git init -q
          b="voice-out-$(basename "${{ inputs.list }}" .json)"
          git checkout -q -b "$b"
          git add -A
          git -c user.name="zizo-voice" -c user.email="zizo-voice@users.noreply.github.com" commit -qm "Voice from ${{ inputs.list }} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$b"
