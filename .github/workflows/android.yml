name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: bash scripts/prepare-android.sh

      # Every test build is signed with ci/debug.keystore (set in scripts/patch_android.py), so a new
      # version installs over the old one and keeps the child's stars and name.
      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Restore the signing key
        if: env.KEYSTORE_PASSWORD != '' && env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/upload.jks

      - name: Build signed release (for Google Play)
        if: env.KEYSTORE_PASSWORD != '' && env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/zizo-world-test.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/zizo-world-v${VERSION_CODE}.aab
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/zizo-world-v${VERSION_CODE}.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: zizo-world-android
          path: out/

      # A fixed download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/test-build/zizo-world-test.apk
      - name: Publish the test APK
        env:
          GH_TOKEN: ${{ github.token }}
        # The file is replaced in place, so the download link never stops working during a build
        run: |
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build out/zizo-world-test.apk --clobber
          else
            gh release create test-build out/zizo-world-test.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "نسخة تجربة - Zizo World" \
              --notes "آخر نسخة تجربة من التطبيق. حمّل الملف zizo-world-test.apk على هاتف أندرويد وثبّته."
          fi
